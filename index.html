<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + user-scalable=no: el chofer va en movimiento y un
         zoom accidental con el mapa a pantalla completa es un estorbo real -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#18181b" />
    <meta name="description" content="Seguimiento en vivo de rutas por equipo" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Instalada en pantalla de inicio, iOS da Wake Lock (18.4+) y una barra
         menos, que en un soporte de coche se agradece -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MapDash" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <title>MapDash</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
